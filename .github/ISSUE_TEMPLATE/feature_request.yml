name: Feature Request
description: Suggest a new utility or enhancement.
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the feature you would like.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem or use case this feature would address.
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API
      description: If applicable, show how you envision the API would look.
      placeholder: |
        import { truncate } from "@rcpthongta/string-utils";

        truncate("Hello, World!", 5); // "Hello..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information or references.
    validations:
      required: false
